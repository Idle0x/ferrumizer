name: "thermal-stage"
version: "0.1.0"
description: |
  Ferrumizer thermal stage: 1-D heat conduction through a slab or cylinder
  cross-section with convective + radiative Robin boundary conditions.
  Driven by a piecewise-linear furnace schedule. Fully differentiable (JAX).

metadata:
  gradient_strategy: autodiff
  stage: thermal
  project: ferrumizer

build_config:
  base_image: "debian:bookworm-slim"
  python_version: "3.12"
  target_platform: "native"
  package_data:
    - ["../shared/ferrumizer_physics", "/tesseract/ferrumizer_physics"]
