[project]
name = "ferrumizer"
version = "0.1.1"
description = "The differentiable heat-treatment engine: gas carburizing end-to-end as one differentiable pipeline."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "The Ferrumizer team" }]
keywords = [
  "gas-carburizing",
  "heat-treatment",
  "differentiable-simulation",
  "tesseract",
  "inverse-problems",
  "effective-case-depth",
]
dependencies = [
  "jax[cpu]==0.11.1",
  "tesseract-core[runtime]==1.11.0",
  "tesseract-jax==0.4.1",
  "equinox==0.13.8",
  "numpyro==0.21.0",
  "arviz==1.3.0",
  "h5netcdf>=1.3",
  "numpy==2.2.6",
  "scipy==1.18.1",
  "pandas>=2.1",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "typer>=0.12",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "rich>=13",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
app = ["streamlit>=1.35"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
ferrumize = "ferrumize.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "components/shared/ferrumizer_physics",
  "app/ferrumize",
  "app/calibration",
  "app/design",
  "app/identifiability",
  "app/ingest",
  "verification",
]

[tool.hatch.build.targets.wheel.force-include]
"app/streamlit_app.py" = "streamlit_app.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
  "E501", "E402", "B007", "B008", "B905", "C408", "E702", "E731",
  "F401", "F841", "I001", "UP037", "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["ferrumizer_physics", "ferrumize", "calibration", "design", "identifiability"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "verification"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.coverage.run]
source = ["ferrumizer_physics"]

[tool.coverage.report]
fail_under = 90
show_missing = true
